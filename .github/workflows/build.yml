# Compila Inteliworks Cloud (Android) = Nextcloud Android (tag UPSTREAM_TAG) + branding/
name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KEYSTORE: ${{ secrets.IW_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout (branding)
        uses: actions/checkout@v4

      - name: Leer version upstream
        id: v
        run: |
          echo "tag=$(tr -d '[:space:]' < UPSTREAM_TAG)" >> "$GITHUB_OUTPUT"
          echo "rev=$(tr -dc '0-9' < BRANDING_REVISION)" >> "$GITHUB_OUTPUT"

      - name: Checkout Nextcloud Android ${{ steps.v.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: nextcloud/android
          ref: ${{ steps.v.outputs.tag }}
          path: upstream
          persist-credentials: false

      - name: Aplicar personalizacion
        run: branding/apply.sh upstream

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validar Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Compilar APK release (sin firmar)
        working-directory: upstream
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=true"
          } >> gradle.properties
          ./gradlew --no-daemon assembleGenericRelease

      - name: Preparar artefacto
        id: out
        run: |
          APK=$(find upstream/app/build/outputs/apk/generic/release -name '*.apk' | head -n1)
          test -n "$APK"
          NAME="inteliworks-cloud-${{ steps.v.outputs.tag }}-iw${{ steps.v.outputs.rev }}-unsigned.apk"
          mkdir -p dist && cp "$APK" "dist/$NAME"
          ls -la dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Firma opcional en CI: solo si existen los secrets (ver README).
      - name: Firmar en CI (opcional)
        env:
          KS_B64: ${{ secrets.IW_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.IW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IW_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.IW_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/iw.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          IN="dist/${{ steps.out.outputs.name }}"
          OUT="${IN%-unsigned.apk}.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/iw.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$RUNNER_TEMP/iw.jks" "$IN"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: inteliworks-cloud-apk
          path: dist/*.apk
          retention-days: 30
